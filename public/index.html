<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockFlow Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="login hidden">
    <div class="card login-card">
      <div class="brand"><span class="logo">⇅</span> StockFlow Pro</div>
      <form id="login-form" class="auth-form">
        <p class="muted">Sign in to manage inventory movements</p>
        <p id="login-notice" class="notice hidden"></p>
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="error"></p>
        <button class="btn primary" type="submit">Sign in</button>
        <p class="muted switch">No account? Ask the admin to create one for you.</p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app-view" class="shell hidden">
    <aside class="sidebar no-print">
      <div class="brand-row">
        <div class="brand"><span class="logo">⇅</span> <span class="company-name">StockFlow Pro</span></div>
        <button id="alerts-btn" class="bell" type="button" title="Alerts" aria-label="Alerts">🔔<span id="alerts-count" class="nav-count hidden">0</span></button>
      </div>
      <nav>
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/sales" data-route="sales">Sales</a>
        <a href="#/products" data-route="products">Products</a>
        <a href="#/movements" data-route="movements">Movements</a>
        <a href="#/orders" data-route="orders">Purchase orders</a>
        <a href="#/contacts" data-route="contacts">Suppliers &amp; customers</a>
        <a href="#/reports" data-route="reports">Reports</a>
        <a href="#/admin" data-route="admin" class="admin-only">Admin</a>
      </nav>
      <div class="sidebar-foot">
        <div id="whoami" class="muted"></div>
        <button id="pw-btn" class="btn ghost small">Change password</button>
        <button id="logout-btn" class="btn ghost small">Log out</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form" class="card"></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print-area"></div>

  <script src="/vendor/jsbarcode.js"></script>
  <script src="js/core.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/movements.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/products.js"></script>
  <script src="js/parties.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/admin.js"></script>
  <script>
    // Old links used #/users for the Admin page.
    if (location.hash.startsWith('#/users')) location.hash = '#/admin';
    api('GET', '/api/me').then((u) => { me = u; showApp(); }).catch(() => showLogin());
  </script>
</body>
</html>
